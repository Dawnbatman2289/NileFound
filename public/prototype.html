<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NileFound - Campus Lost & Found Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 pb-12 font-sans">
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-wide">NileFound</h1>
      <p class="text-xs text-emerald-200">Nile University Lost & Found Portal</p>
    </div>
    <span id="network-status" class="text-xs bg-emerald-800 px-2 py-1 rounded border border-emerald-600">Online</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="flex border-b border-slate-200 bg-white rounded-t p-1 shadow-sm">
      <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 py-2 text-center text-sm font-semibold border-b-2 border-emerald-600 text-emerald-700">Feed</button>
      <button onclick="switchTab('report')" id="tab-report" class="flex-1 py-2 text-center text-sm font-semibold text-slate-500">Report Item</button>
      <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-2 text-center text-sm font-semibold text-slate-500">Admin</button>
    </div>

    <section id="view-feed" class="space-y-3">
      <div class="flex gap-2">
        <input type="text" id="search-input" oninput="renderFeed()" placeholder="Search items (e.g. ID card, phone)..." class="w-full p-2 text-sm border rounded shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        <select id="location-filter" onchange="renderFeed()" class="p-2 text-sm border rounded shadow-sm bg-white">
          <option value="">All Locations</option>
          <option value="Ubangi STEM Lab">Ubangi STEM Lab</option>
          <option value="Limpopo Bay (Law)">Limpopo Bay (Law)</option>
          <option value="Nile Library">Nile Library</option>
          <option value="Student Centre">Student Centre</option>
          <option value="Male Hostel">Male Hostel</option>
        </select>
      </div>
      <div id="feed-container" class="space-y-3"></div>
    </section>

    <section id="view-report" class="hidden bg-white p-4 rounded shadow space-y-3">
      <h2 class="text-base font-bold border-b pb-2">Log Misplaced / Found Property</h2>
      <div>
        <label class="block text-xs font-semibold mb-1">Report Type</label>
        <select id="form-type" onchange="toggleVerificationField()" class="w-full p-2 border text-sm rounded">
          <option value="LOST">I Lost Something</option>
          <option value="FOUND">I Found Something</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Title</label>
        <input type="text" id="form-title" placeholder="e.g. Blue Student ID Card" class="w-full p-2 border text-sm rounded">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Campus Location</label>
        <select id="form-location" class="w-full p-2 border text-sm rounded">
          <option value="Ubangi STEM Lab">Ubangi STEM Lab</option>
          <option value="Limpopo Bay (Law)">Limpopo Bay (Law)</option>
          <option value="Nile Library">Nile Library</option>
          <option value="Student Centre">Student Centre</option>
          <option value="Niger House">Niger House</option>
          <option value="Male Hostel">Male Hostel</option>
          <option value="Female Hostel">Female Hostel</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Description</label>
        <textarea id="form-desc" placeholder="Provide general details..." class="w-full p-2 border text-sm rounded h-20"></textarea>
      </div>
      <div id="verification-group" class="hidden bg-amber-50 p-2 rounded border border-amber-200">
        <label class="block text-xs font-semibold text-amber-800 mb-1">Hidden Verification Detail (Private)</label>
        <input type="text" id="form-verification" placeholder="e.g. Scratch on back cover / lockscreen photo" class="w-full p-2 border text-sm rounded">
        <p class="text-[10px] text-amber-600 mt-1">This detail will never be shown publicly. Claimants must match this.</p>
      </div>
      <button onclick="submitReport()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-sm shadow">Submit Report</button>
    </section>

    <section id="view-admin" class="hidden bg-white p-4 rounded shadow space-y-3">
      <h2 class="text-base font-bold border-b pb-2">Student Services Oversight Console</h2>
      <div id="admin-stats" class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-slate-100 p-2 rounded"><span class="block text-lg font-bold text-emerald-700" id="stat-total">0</span><span class="text-[10px] text-slate-500">Total Listings</span></div>
        <div class="bg-slate-100 p-2 rounded"><span class="block text-lg font-bold text-amber-600" id="stat-pending">0</span><span class="text-[10px] text-slate-500">Pending Claims</span></div>
      </div>
      <div id="admin-items-list" class="space-y-2 text-xs"></div>
    </section>
  </main>

  <script>
    const defaultData = [
      { id: '1', type: 'FOUND', title: 'Student ID Card', location: 'Ubangi STEM Lab', desc: 'Found near Lab 3 entrance. Blue lanyard attached.', status: 'ACTIVE', sensitive: true, verification: 'Matric No ends in 042' },
      { id: '2', type: 'LOST', title: 'Scientific Calculator (FX-991EX)', location: 'Nile Library', desc: 'Silver cover casing with masking tape on back.', status: 'ACTIVE', sensitive: false, verification: '' }
    ];

    if (!localStorage.getItem('nilefound_data')) {
      localStorage.setItem('nilefound_data', JSON.stringify(defaultData));
    }

    function getData() { return JSON.parse(localStorage.getItem('nilefound_data')); }
    function saveData(data) { localStorage.setItem('nilefound_data', JSON.stringify(data)); }

    function switchTab(tab) {
      ['feed', 'report', 'admin'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-700');
        document.getElementById(`tab-${t}`).classList.add('text-slate-500');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('border-b-2', 'border-emerald-600', 'text-emerald-700');
      document.getElementById(`tab-${tab}`).classList.remove('text-slate-500');
      if (tab === 'feed') renderFeed();
      if (tab === 'admin') renderAdmin();
    }

    function toggleVerificationField() {
      const type = document.getElementById('form-type').value;
      const group = document.getElementById('verification-group');
      if (type === 'FOUND') group.classList.remove('hidden');
      else group.classList.add('hidden');
    }

    function submitReport() {
      const data = getData();
      const newItem = {
        id: Date.now().toString(),
        type: document.getElementById('form-type').value,
        title: document.getElementById('form-title').value,
        location: document.getElementById('form-location').value,
        desc: document.getElementById('form-desc').value,
        verification: document.getElementById('form-verification').value,
        status: 'ACTIVE',
        sensitive: document.getElementById('form-title').value.toLowerCase().includes('id')
      };
      if (!newItem.title) return alert('Please enter a title');
      data.unshift(newItem);
      saveData(data);
      alert('Report logged successfully!');
      switchTab('feed');
    }

    function renderFeed() {
      const data = getData();
      const search = document.getElementById('search-input').value.toLowerCase();
      const loc = document.getElementById('location-filter').value;
      const container = document.getElementById('feed-container');
      container.replaceChildren();

      const filtered = data.filter(item => 
        (item.title.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search)) &&
        (loc === '' || item.location === loc)
      );

      if (filtered.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'text-xs text-center text-slate-400 py-6';
        empty.textContent = 'No matching lost or found records on campus.';
        container.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded shadow-sm border border-slate-100 space-y-2";
        const header = document.createElement('div');
        header.className = 'flex justify-between items-start';
        const type = document.createElement('span');
        type.className = `text-[10px] font-bold px-2 py-0.5 rounded ${item.type === 'LOST' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`;
        type.textContent = item.type;
        const location = document.createElement('span');
        location.className = 'text-[10px] text-slate-400';
        location.textContent = item.location;
        header.append(type, location);
        const title = document.createElement('h3');
        title.className = `text-sm font-bold ${item.sensitive ? 'blur-[2px] select-none' : ''}`;
        title.textContent = item.title;
        const description = document.createElement('p');
        description.className = 'text-xs text-slate-600';
        description.textContent = item.desc;
        card.appendChild(header);
        card.append(title, description);
        if (item.type === 'FOUND') {
          const claimButton = document.createElement('button');
          claimButton.className = 'w-full mt-2 bg-slate-800 text-white text-xs py-1.5 rounded hover:bg-slate-900';
          claimButton.textContent = 'Claim This Item';
          claimButton.addEventListener('click', () => promptClaim(item.id));
          card.appendChild(claimButton);
        }
        container.appendChild(card);
      });
    }

    function promptClaim(id) {
      const ans = prompt("To claim this item, describe a hidden attribute (e.g. lockscreen, sticker, internal contents):");
      if (ans) {
        alert("Claim submitted to finder and Student Services desk for verification.");
      }
    }

    function renderAdmin() {
      const data = getData();
      document.getElementById('stat-total').innerText = data.length;
      document.getElementById('stat-pending').innerText = data.filter(i => i.status === 'CLAIM_PENDING').length;
      const list = document.getElementById('admin-items-list');
      list.replaceChildren();
      data.forEach(i => {
        const row = document.createElement('div');
        row.className = 'p-2 border rounded flex justify-between items-center';
        const details = document.createElement('div');
        const title = document.createElement('p');
        title.className = 'font-bold';
        title.textContent = `${i.title} (${i.type})`;
        const verification = document.createElement('p');
        verification.className = 'text-[10px] text-slate-400';
        verification.textContent = `${i.location} | Hidden: ${i.verification || 'None'}`;
        details.append(title, verification);
        const deleteButton = document.createElement('button');
        deleteButton.className = 'text-red-600 hover:underline';
        deleteButton.textContent = 'Purge';
        deleteButton.addEventListener('click', () => deleteItem(i.id));
        row.append(details, deleteButton);
        list.appendChild(row);
      });
    }

    function deleteItem(id) {
      let data = getData().filter(i => i.id !== id);
      saveData(data);
      renderAdmin();
    }

    window.addEventListener('online', () => document.getElementById('network-status').innerText = 'Online');
    window.addEventListener('offline', () => document.getElementById('network-status').innerText = 'Offline (Cached)');

    renderFeed();
  </script>
</body>
</html>
