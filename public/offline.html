<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NileFound - Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #FAF6EF;
      color: #1F1B16;
      font-family: system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #141311; color: #F5F1EA; }
      .card { background: #1E1C18 !important; border-color: #3E3931 !important; }
      .muted { color: #CEC7BB !important; }
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #C4BBAF;
      border-radius: 12px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: #4A443C; }
    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #0F6E6E;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>You are offline</h1>
    <p class="muted">NileFound needs an internet connection to load live campus notices and claims. Reconnect to mobile data or campus Wi-Fi, then try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
